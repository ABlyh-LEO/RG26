name: CI

# **全量质量门禁**：在 PR、手动触发，以及**代码变更**的 main push 上执行。
#
# 纯数据更新（现场发布成绩只改 data/event.json 与 public/data/event.json）不触发这里：
# 那条路径由 deploy.yml 的轻量门禁覆盖（构建含数据校验与类型检查 + 桌面 Chromium
# 渲染回归）。一天几十次成绩更新，没必要每次重跑全量四项目渲染与全部领域测试。
on:
  pull_request:
  push:
    branches: ['main']
    paths-ignore:
      - 'data/**'
      - 'public/data/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: 类型检查 · Lint · 测试 · 数据校验 · 构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: 安装锁定依赖
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: 缓存 Playwright 浏览器
        # 浏览器包体大（chromium + webkit 约数百 MB），缓存后无需每次重新下载。
        # 键与实际安装的版本绑定：package-lock.json 变化时自动换新缓存。
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: 类型检查
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: 领域测试（含第 13 节验收用例）
        run: npm run test

      - name: 数据校验
        run: npm run validate:data

      - name: 构建（含公开快照生成）
        run: npm run build

      - name: 安装 Playwright 浏览器
        # 必须与 playwright.config.ts 里声明的 projects **一一对应**。
        # 配置里除了三个 Chromium 项目，还有 mobile-webkit
        # （除非设置 E2E_SKIP_WEBKIT=1）。只装 chromium 会让全部
        # webkit 用例以「Executable doesn't exist」失败 —— 那是假失败，
        # 会让 CI 长期变红而失去报警能力。
        run: npx playwright install --with-deps chromium webkit

      - name: 端到端测试
        # 直接验证上一步的生产产物，避免测试服务器再次构建覆盖它。
        env:
          E2E_SKIP_BUILD: '1'
        run: npm run test:e2e

      - name: 本地维护工作台端到端测试（Chromium 与 WebKit）
        # 使用临时 Git 仓库和独立本机 API，不改动正式源或公开构建。
        run: npx playwright test --config playwright.operator.config.ts

      - name: 上传 Playwright 报告（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/operator/
          retention-days: 7

      - name: 上传构建产物（仅在失败时，便于排查）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
