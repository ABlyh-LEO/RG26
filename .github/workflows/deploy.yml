name: Deploy to GitHub Pages

# 在发布分支 push 或手动触发时部署。
#
# 结构（2026-10-03 提速）：串行路径只剩
#   构建 → 渲染门禁（桌面 Chromium 全量用例）→ 部署
#
# 定位：**这是"发布通道"，不是全量质量门禁**。现场一天会发布几十次成绩，
# 每次都重跑全部检查既慢又没必要：
# - 构建里已包含数据校验与类型检查（`npm run build`）；
# - 渲染门禁只跑桌面 Chromium 的完整用例集，验证观众真正拿到的产物；
# - 四个项目的全量渲染回归、维护端 e2e、全部领域测试都在 ci.yml（PR / 手动 /
#   代码变更）里执行；只改 data/** 的提交不会触发 ci.yml。
on:
  push:
    branches: ['main']
    paths:
      # 只列**会影响公开产物**的路径。改 tests/** 不再触发部署：
      # 它不改变 dist，纯测试提交不该占用部署时间。
      - 'data/event.json'
      - 'public/**'
      - 'src/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'playwright.config.ts'
      - 'vitest.config.ts'
      - 'eslint.config.js'
      - 'tsconfig*.json'
      - '.nvmrc'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# GitHub Pages 官方要求的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一站点串行化部署，避免旧版本后完成而覆盖新版本。
# cancel-in-progress: false 保证正在进行的部署不会被中途取消。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ---- 构建（串行路径第一步，目标 ≤ 2 分钟）------------------------------
  build:
    name: 构建
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.snapshot.outputs.revision }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: 安装锁定依赖
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 构建（含数据校验与公开快照生成）
        # `npm run build` = validate:data → data:build → tsc -b → vite build：
        # 数据校验与类型检查都在这一条命令里，不单列重复步骤。
        env:
          # 项目站是 https://<owner>.github.io/<repo>/，因此用仓库名作为 base。
          # 若改用用户站或自定义域名，把这里改成 '/'.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: 校验公开快照可读且版本一致
        id: snapshot
        run: |
          node -e "
          const fs = require('node:fs');
          const snap = JSON.parse(fs.readFileSync('dist/data/event.json', 'utf8'));
          if (!/^[a-f0-9]{32}$/.test(snap.revision || '') || snap.schemaVersion !== 1 || !snap.data || snap.sourceCommit !== process.env.GITHUB_SHA) {
            console.error('公开快照缺少必要字段，或 sourceCommit 与本次提交不符');
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'revision=' + snap.revision + '\n');
          console.log('revision =', snap.revision);
          console.log('schemaVersion =', snap.schemaVersion);
          console.log('builtAt =', snap.builtAt);
          console.log('队伍数 =', snap.data.teams.length);
          "

      - name: 检查产物不含维护模式入口
        run: |
          if [ -f dist/operator.html ]; then
            echo "::error::公开产物中不应包含维护模式入口 operator.html"
            exit 1
          fi
          echo "公开产物未包含维护模式入口。"

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 暂存 dist 供渲染回归使用
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ---- 渲染轻量门禁（验证即将上传的 dist；单项目，不再全量四项目）--------
  smoke:
    name: 渲染门禁
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: 安装锁定依赖
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: 缓存 Playwright 浏览器
        # 与 ci.yml 同一缓存键：工作流之间共享，命中后不再下载浏览器。
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: 下载待发布的 dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: 确认 dist 结构
        # 产物传递一旦出错，这里立刻给出可诊断的信息，而不是让 e2e 报一堆 404。
        run: |
          test -f dist/index.html || { echo "::error::dist 结构不符合预期（缺少 dist/index.html）"; ls -R dist | head -30; exit 1; }
          test -f dist/data/event.json || { echo "::error::dist 缺少公开快照 dist/data/event.json"; exit 1; }
          echo "dist 结构与公开快照就绪。"

      - name: 安装 Playwright 浏览器（仅 Chromium）
        run: npx playwright install --with-deps chromium

      - name: 渲染回归（失败则阻止部署）
        # 轻量门禁：只跑**桌面 Chromium 的完整用例集**，验证"观众真的会看到的产物"。
        # 四个项目的全量渲染回归、维护端 e2e 与全部领域测试都在 ci.yml（PR / 手动 /
        # 代码变更）里执行——现场一天要发布几十次成绩，没必要每次都重跑全量。
        #
        # 关键点：
        # 1. **不能重新构建**。dist 来自构建 job，已带 VITE_BASE_PATH（仓库子路径）；
        #    e2e 的 webServer 若再跑一次 build:only，会用一个 base:'/' 的包覆盖它，
        #    上传到 Pages 的产物就坏了。因此设 E2E_SKIP_BUILD=1，只启动静态服务。
        # 2. **base 必须带子路径**。产物里资源指向 /<repo>/assets/...，
        #    静态服务和浏览器导航都必须保留该前缀；缺失资源如实返回 404。
        env:
          E2E_SKIP_BUILD: '1'
          E2E_BASE_URL: http://127.0.0.1:4173/${{ github.event.repository.name }}/
        run: npx playwright test --project=desktop-chromium

      - name: 上传 Playwright 报告（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ---- 部署 ------------------------------------------------------------
  deploy:
    name: 部署
    needs: [build, smoke]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出本次部署的验证脚本
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 核验本次公开版本（最多等待 3 分钟）
        timeout-minutes: 4
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_REVISION: ${{ needs.build.outputs.revision }}
        # 不调用 Actions API，也不依赖“部署 action 已成功”来推断观众可见。
        # 脚本使用 cache-bust；网络/HTTP/结构/双字段不符均重试，180s 到期失败。
        run: node scripts/verify-pages.mjs
