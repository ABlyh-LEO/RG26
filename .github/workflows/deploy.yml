name: Deploy to GitHub Pages

# 在发布分支 push 或手动触发时部署。
# 只有必需检查通过后才上传并部署。
on:
  push:
    branches: ['main']
    paths:
      # 只列**会影响公开产物**的路径。改 tests/** 不再触发部署：
      # 它不改变 dist，纯测试提交不该占用 3–5 分钟部署。
      - 'data/event.json'
      - 'public/**'
      - 'src/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'playwright.config.ts'
      - 'vitest.config.ts'
      - 'eslint.config.js'
      - 'tsconfig*.json'
      - '.nvmrc'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# GitHub Pages 官方要求的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一站点串行化部署，避免旧版本后完成而覆盖新版本。
# cancel-in-progress: false 保证正在进行的部署不会被中途取消。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 必需检查与构建
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.snapshot.outputs.revision }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: 安装锁定依赖
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: 缓存 Playwright 浏览器
        # 与 ci.yml 同一缓存键：两个工作流共享，首次之后不再下载浏览器。
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: 领域测试（发布门禁：评分/配对/排名的规则回归）
        run: npm run test

      - name: 配置 Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: 构建（含数据校验与公开快照生成）
        # `npm run build` = validate:data → data:build → tsc -b → vite build：
        # 数据校验与类型检查都在这一条命令里，不再单列重复步骤。
        env:
          # 项目站是 https://<owner>.github.io/<repo>/，因此用仓库名作为 base。
          # 若改用用户站或自定义域名，把这里改成 '/'.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: 校验公开快照可读且版本一致
        id: snapshot
        run: |
          node -e "
          const fs = require('node:fs');
          const snap = JSON.parse(fs.readFileSync('dist/data/event.json', 'utf8'));
          if (!/^[a-f0-9]{32}$/.test(snap.revision || '') || snap.schemaVersion !== 1 || !snap.data || snap.sourceCommit !== process.env.GITHUB_SHA) {
            console.error('公开快照缺少必要字段，或 sourceCommit 与本次提交不符');
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'revision=' + snap.revision + '\n');
          console.log('revision =', snap.revision);
          console.log('schemaVersion =', snap.schemaVersion);
          console.log('builtAt =', snap.builtAt);
          console.log('队伍数 =', snap.data.teams.length);
          "

      - name: 检查产物不含维护模式入口
        run: |
          if [ -f dist/operator.html ]; then
            echo "::error::公开产物中不应包含维护模式入口 operator.html"
            exit 1
          fi
          echo "公开产物未包含维护模式入口。"

      - name: 安装 Playwright 浏览器
        # 与 ci.yml / playwright.config.ts 保持一致：配置里有 mobile-webkit，
        # 只装 chromium 会让 webkit 用例全部假失败。
        # 上面的缓存命中时这一步只补齐系统依赖，不再下载浏览器。
        run: npx playwright install --with-deps chromium webkit

      - name: 端到端测试（失败则阻止部署）
        # 部署是"观众真的会看到"的一步，必须挡住渲染类缺陷。
        #
        # 两个关键点：
        # 1. **不能重新构建**。上面的构建已带 VITE_BASE_PATH（仓库子路径），
        #    正是线上使用的 base；e2e 的 webServer 若再跑一次 build:only，
        #    会用一个 base:'/' 的包覆盖掉它，上传到 Pages 的产物就坏了。
        #    因此设 E2E_SKIP_BUILD=1，只启动静态服务验证现有产物。
        # 2. **base 必须带子路径**。产物里资源指向 /<repo>/assets/...，
        #    静态服务和浏览器导航都必须保留该前缀；缺失资源如实返回 404。
        #
        # 这里只跑观众端 e2e：它验证的正是即将上传的 dist。
        # 维护端 e2e（playwright.operator.config.ts）验证的是本地工作台与临时
        # Git 仓库，与 Pages 产物无关，跑在 ci.yml 里即可——原先在部署路径上
        # 重复跑它，白占了 2–3 分钟。
        env:
          E2E_SKIP_BUILD: '1'
          E2E_BASE_URL: http://127.0.0.1:4173/${{ github.event.repository.name }}/
        run: npm run test:e2e

      - name: 上传 Playwright 报告（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/operator/
          retention-days: 7

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 部署
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出本次部署的验证脚本
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 核验本次公开版本（最多等待 3 分钟）
        timeout-minutes: 4
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_REVISION: ${{ needs.build.outputs.revision }}
        # 不调用 Actions API，也不依赖“部署 action 已成功”来推断观众可见。
        # 脚本使用 cache-bust；网络/HTTP/结构/双字段不符均重试，180s 到期失败。
        run: node scripts/verify-pages.mjs
