name: Deploy to GitHub Pages

# 在发布分支 push 或手动触发时部署。
# 只有必需检查通过后才上传并部署。
on:
  push:
    branches: ['main']
    paths:
      - 'data/event.json'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'playwright.config.ts'
      - 'vitest.config.ts'
      - 'eslint.config.js'
      - 'tsconfig*.json'
      - '.nvmrc'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# GitHub Pages 官方要求的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一站点串行化部署，避免旧版本后完成而覆盖新版本。
# cancel-in-progress: false 保证正在进行的部署不会被中途取消。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 必需检查与构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: 安装锁定依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: 领域测试
        run: npm run test

      - name: 数据校验（失败则阻止部署）
        run: npm run validate:data

      - name: 配置 Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: 构建（base 使用仓库子路径）
        env:
          # 项目站是 https://<owner>.github.io/<repo>/，因此用仓库名作为 base。
          # 若改用用户站或自定义域名，把这里改成 '/'.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: 校验公开快照可读且版本一致
        run: |
          node -e "
          const fs = require('node:fs');
          const snap = JSON.parse(fs.readFileSync('dist/data/event.json', 'utf8'));
          if (!snap.revision || !snap.schemaVersion || !snap.data) {
            console.error('公开快照缺少必要字段');
            process.exit(1);
          }
          console.log('revision =', snap.revision);
          console.log('schemaVersion =', snap.schemaVersion);
          console.log('builtAt =', snap.builtAt);
          console.log('队伍数 =', snap.data.teams.length);
          "

      - name: 检查产物不含维护模式入口
        run: |
          if [ -f dist/operator.html ]; then
            echo "::error::公开产物中不应包含维护模式入口 operator.html"
            exit 1
          fi
          echo "公开产物未包含维护模式入口。"

      - name: 安装 Playwright 浏览器
        # 与 ci.yml / playwright.config.ts 保持一致：配置里有 mobile-webkit，
        # 只装 chromium 会让 webkit 用例全部假失败。
        run: npx playwright install --with-deps chromium webkit

      - name: 端到端测试（失败则阻止部署）
        # 部署是"观众真的会看到"的一步，必须挡住渲染类缺陷。
        #
        # 两个关键点：
        # 1. **不能重新构建**。上面的构建已带 VITE_BASE_PATH（仓库子路径），
        #    正是线上使用的 base；e2e 的 webServer 若再跑一次 build:only，
        #    会用一个 base:'/' 的包覆盖掉它，上传到 Pages 的产物就坏了。
        #    因此设 E2E_SKIP_BUILD=1，只启动静态服务验证现有产物。
        # 2. **base 必须带子路径**。产物里资源指向 /<repo>/assets/...，
        #    静态服务和浏览器导航都必须保留该前缀；缺失资源如实返回 404。
        env:
          E2E_SKIP_BUILD: '1'
          E2E_BASE_URL: http://127.0.0.1:4173/${{ github.event.repository.name }}/
        run: npm run test:e2e

      - name: 上传 Playwright 报告（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 部署
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 部署后检查
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "部署地址：$PAGE_URL"
          # 检查首页可读
          curl -fsS --max-time 30 "$PAGE_URL" -o /tmp/index.html
          grep -q 'RoboGame2026' /tmp/index.html && echo "首页可读"
          # 检查公开 JSON 可读且可解析
          curl -fsS --max-time 30 "${PAGE_URL%/}/data/event.json" -o /tmp/event.json
          node -e "
          const snap = JSON.parse(require('node:fs').readFileSync('/tmp/event.json','utf8'));
          console.log('公开数据 revision =', snap.revision);
          if (snap.schemaVersion !== 1) { console.error('schemaVersion 不一致'); process.exit(1); }
          "
          echo "部署后检查通过。注意：CDN 传播可能有延迟。"
